{% extends 'base.html' %}

{% block title %}Post Job | Job Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card form-card">
            <div class="card-body p-4 p-lg-5">
                <h2 class="mb-4">Post a new job</h2>
                <form method="post" class="row g-3">
                    {% csrf_token %}
                    <div class="col-12">
                        <label class="form-label">Job title</label>
                        <input class="form-control" name="title" placeholder="Frontend Developer">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="5" placeholder="Describe the role, expectations, and requirements"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        <input class="form-control" name="location" placeholder="Bangalore / Remote">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Salary</label>
                        <input class="form-control" name="salary" type="number" placeholder="600000">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Publish Job</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
